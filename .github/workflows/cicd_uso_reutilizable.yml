name: Pipeline principal que reutiliza la plantilla
on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
jobs:
    # Bloque de job que utilizará el workflow reutilizable
    pruebas:
        uses: ./.github/workflows/w_reutilizable.yml
        # Pasar parámetros al workflow reutilizable
        with:
            # Coincidir con los nombres de los parámetros
            java-version: 25
    # Se puede crear otros jobs además del que se esta utilizando
    deploy:
        needs: pruebas
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.1
            - name: Configurar JDK 25
              uses: actions/setup-java@v6.0.1
              with:
                distribution: 'temurin'
                java-version: '25'