name: Pipeline principal que reutiliza la plantilla
on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
jobs:
    pruebas:
        uses: ./.github/workflows/w_reutilizable.yml
        with:
            java-version: 25
    deploy:
        needs: pruebas
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.1
            - name: Configurar JDK 25
              uses: actions/setup-java@v6.0.1
              with:
                distribution: 'temurin'
                java-version: '25'